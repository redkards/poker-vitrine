services:
  # MariaDB 10.6 : meme moteur que l'hebergement o2switch (leur PostgreSQL 9.6 est trop ancien pour Doctrine DBAL 4)
  database:
    image: mariadb:10.6
    container_name: pokervitrine_db
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pokervitrine}
      MARIADB_USER: ${DB_USER:-poker}
      # A changer en production
      MARIADB_PASSWORD: ${DB_PASSWORD:-poker}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports:
      # 3307 cote hote : le 3306 est reserve au MySQL de WAMP
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb_data:/var/lib/mysql:rw

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pokervitrine_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web : http://localhost:8025

  # Optionnel : temps reel (notifications forum)
  mercure:
    image: dunglas/mercure:v0.16
    container_name: pokervitrine_mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:4200
        anonymous
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mariadb_data:
  mercure_data:
  mercure_config:
