services:
  database:
    image: postgres:16-alpine
    container_name: pokervitrine_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokervitrine}
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      # A changer en production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker}
    ports:
      # 5433 cote hote : un PostgreSQL Windows occupe deja le 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-pokervitrine}", "-U", "${POSTGRES_USER:-poker}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pokervitrine_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web : http://localhost:8025

  # Optionnel : temps reel (notifications forum)
  mercure:
    image: dunglas/mercure:v0.16
    container_name: pokervitrine_mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:4200
        anonymous
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  database_data:
  mercure_data:
  mercure_config:
