framework:
    rate_limiter:
        # POST /api/register : 5 requetes / minute / IP
        register:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # POST /api/verify-email/resend : evite le spam d'emails
        verification_resend:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # Forum : anti-spam, 5 messages (sujets + reponses) / minute / membre
        forum_post:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # Boutique (v2.0) : 5 commandes / 10 minutes / membre
        shop_order:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
