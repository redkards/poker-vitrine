framework:
    rate_limiter:
        # POST /api/register : 5 requetes / minute / IP
        register:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # POST /api/verify-email/resend : evite le spam d'emails
        verification_resend:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # Forum : anti-spam, 5 messages (sujets + reponses) / minute / membre
        forum_post:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # Signalements du forum : 10 / heure / membre (evite d'inonder la file de moderation)
        forum_report:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # GET /api/search : 30 recherches / minute / IP (requetes LIKE couteuses)
        search:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # POST /api/premium/subscribe : 5 tentatives / 10 minutes / membre
        premium_subscribe:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
